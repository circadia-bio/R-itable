name: Notify website of Zenodo release

on:
  release:
    types: [published]

jobs:
  update-website-doi:
    uses: circadia-bio/website/.github/workflows/zenodo-doi-lookup.yml@main
    with:
      package-name: "R-itable"
      repo: "R-itable"
    secrets:
      website-pat: ${{ secrets.WEBSITE_PAT }}
